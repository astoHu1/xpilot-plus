name: "Build xPilot for macOS"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  VATSIM_AUTH_REF: ${{ vars.VATSIM_AUTH_REF }}
  CLIENT_DIR: ${{ github.workspace }}/client
  PLUGIN_DIR: ${{ github.workspace }}/plugin
  QT_VERSION: "6.5.2"
  MIN_OS_VERSION: "11.0"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false

      - name: Check release prerequisites
        id: policy
        env:
          HAS_AUTH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
          HAS_INSTALLER_LICENSE: ${{ secrets.INSTALLBUILDER_LICENSE != '' }}
          HAS_CLIENT_ID: ${{ secrets.VATSIM_CLIENT_ID != '' }}
          HAS_CLIENT_KEY: ${{ secrets.VATSIM_CLIENT_KEY != '' }}
          HAS_TOWERVIEW_ID: ${{ secrets.VATSIM_TOWERVIEW_CLIENT_ID != '' }}
          HAS_CONFIG_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY != '' }}
          HAS_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD != '' }}
          HAS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' }}
          HAS_NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME != '' }}
          HAS_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: python3 scripts/ci_build_policy.py preflight macos

      - name: Checkout approved real auth library (release only)
        if: env.RELEASE_BUILD == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: xpilot-project/vatsim-auth
          ref: ${{ env.VATSIM_AUTH_REF }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: dependencies/vatsim-auth
          persist-credentials: false

      - name: Record authentication provenance
        run: python3 scripts/ci_build_policy.py manifest BUILD-STATUS.txt

      - name: Build plugin
        run: |
          cmake -S "$PLUGIN_DIR" -B "$PLUGIN_DIR/build" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_OS_VERSION"
          cmake --build "$PLUGIN_DIR/build" --config "$BUILD_TYPE"

      - name: Package plugin
        run: |
          mkdir -p "xPilot/mac_x64"
          cp "$PLUGIN_DIR/build/mac_x64/xPilot.xpl" "xPilot/mac_x64/"
          cp "$PLUGIN_DIR/3rdparty/fmod/libfmod.dylib" "xPilot/mac_x64/"
          cp -R "$PLUGIN_DIR/Resources" xPilot/
          dsymutil "$PLUGIN_DIR/build/mac_x64/xPilot.xpl" -o xPilot/mac_x64/xPilot.dSYM
          install_name_tool -id @executable_path/../../../Resources/plugins/xPilot/mac_x64/libfmod.dylib xPilot/mac_x64/libfmod.dylib
          install_name_tool -change @rpath/libfmod.dylib @executable_path/../../../Resources/plugins/xPilot/mac_x64/libfmod.dylib xPilot/mac_x64/xPilot.xpl

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: qt6
          key: qt-${{ runner.os }}-${{ runner.arch }}-6.5.2-macos-qtmultimedia-aqt3.3.0

      - name: Download Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m qtmultimedia --outputdir qt6

      - name: Setup Qt
        run: |
          echo "Qt6_HOME=$GITHUB_WORKSPACE/qt6/$QT_VERSION/macos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/qt6/$QT_VERSION/macos/bin" >> "$GITHUB_PATH"
          python3 scripts/patch_qt_macos.py "qt6/$QT_VERSION/macos/lib"

      - name: Build client
        env:
          VATSIM_CLIENT_ID: ${{ env.RELEASE_BUILD == 'true' && secrets.VATSIM_CLIENT_ID || '0' }}
          VATSIM_CLIENT_KEY: ${{ env.RELEASE_BUILD == 'true' && secrets.VATSIM_CLIENT_KEY || 'development' }}
          VATSIM_TOWERVIEW_CLIENT_ID: ${{ env.RELEASE_BUILD == 'true' && secrets.VATSIM_TOWERVIEW_CLIENT_ID || '0' }}
          CONFIG_ENCRYPTION_KEY: ${{ env.RELEASE_BUILD == 'true' && secrets.CONFIG_ENCRYPTION_KEY || '0' }}
          ALLOW_AUTH_STUB: ${{ steps.policy.outputs.allow_auth_stub }}
        run: |
          cmake -S "$CLIENT_DIR" -B "$CLIENT_DIR/build" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DXPILOT_ALLOW_AUTH_STUB="$ALLOW_AUTH_STUB" \
            -DVATSIM_CLIENT_ID="$VATSIM_CLIENT_ID" \
            -DVATSIM_CLIENT_KEY="$VATSIM_CLIENT_KEY" \
            -DVATSIM_TOWERVIEW_CLIENT_ID="$VATSIM_TOWERVIEW_CLIENT_ID" \
            -DCONFIG_ENCRYPTION_KEY="$CONFIG_ENCRYPTION_KEY" \
            -DCMAKE_PREFIX_PATH="$Qt6_HOME" \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/dependencies/platform/macos/openssl" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_OS_VERSION"
          cmake --build "$CLIENT_DIR/build" --config "$BUILD_TYPE"

      # Import keys only after all compilation and dependency installation.
      - name: Load developer certificate
        if: env.RELEASE_BUILD == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/make_keychain.sh

      - name: Code sign plugin
        env:
          SIGNING_IDENTITY: ${{ env.RELEASE_BUILD == 'true' && secrets.APPLE_SIGNING_CERTIFICATE_IDENTITY || '' }}
        run: |
          options=(--force --sign "${SIGNING_IDENTITY:--}")
          if [[ "$RELEASE_BUILD" == true ]]; then
            options+=(--options runtime --timestamp)
          fi
          for binary in xPilot/mac_x64/libfmod.dylib xPilot/mac_x64/xPilot.xpl; do
            codesign "${options[@]}" "$binary"
            lipo "$binary" -verify_arch x86_64 arm64
            codesign --verify --strict --all-architectures "$binary"
          done

      - name: Deploy application
        env:
          SIGNING_IDENTITY: ${{ env.RELEASE_BUILD == 'true' && secrets.APPLE_SIGNING_CERTIFICATE_IDENTITY || '' }}
        run: |
          ./scripts/package_macos.sh "$CLIENT_DIR/build/xPilot.app" \
            "$CLIENT_DIR/Resources" "$CLIENT_DIR/entitlements.plist" "$SIGNING_IDENTITY"

      - name: Verify application bundle (static only)
        env:
          SIGNING_TEAM: ${{ env.RELEASE_BUILD == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          options=(--signature development)
          if [[ "$RELEASE_BUILD" == true ]]; then
            options=(--signature developer-id --team-id "$SIGNING_TEAM")
          fi
          ./scripts/verify_macos_app.sh "$CLIENT_DIR/build/xPilot.app" "${options[@]}"

      - name: Notarize application bundle
        if: env.RELEASE_BUILD == 'true'
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$CLIENT_DIR/build/xPilot.app" xPilot-notarization.zip
          xcrun notarytool submit xPilot-notarization.zip \
            --apple-id "$NOTARIZATION_USERNAME" --password "$NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$CLIENT_DIR/build/xPilot.app"
          xcrun stapler validate "$CLIENT_DIR/build/xPilot.app"

      - name: Get version
        run: |
          echo "XPILOT_VERSION=$(jq -r 'if .is_beta == true then "\(.version.major).\(.version.minor).\(.version.patch)-beta.\(.beta_number)" else "\(.version.major).\(.version.minor).\(.version.patch)" end' xpilot.json)" >> "$GITHUB_ENV"

      - name: Build installer (release only)
        if: env.RELEASE_BUILD == 'true'
        env:
          IB_LICENSE: ${{ secrets.INSTALLBUILDER_LICENSE }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_CERTIFICATE_IDENTITY }}
        run: |
          umask 077
          license_file="$RUNNER_TEMP/xpilot-installbuilder-license.xml"
          trap 'rm -f "$license_file"' EXIT
          printf '%s' "$IB_LICENSE" > "$license_file"
          curl --fail --show-error --location "https://releases.installbuilder.com/installbuilder/installbuilder-enterprise-24.3.0-osx-installer.dmg" --output "ib.dmg"
          hdiutil attach ib.dmg
          /Volumes/InstallBuilder\ Enterprise/*.app/Contents/MacOS/installbuilder.sh --mode unattended --prefix ../ib
          export CLIENT_BUILD_DIR="$CLIENT_DIR/build"
          export PLUGIN_BUILD_DIR="$GITHUB_WORKSPACE/xPilot"
          ../ib/bin/builder build installer/macos.xml \
            --license "$license_file" \
            --setvars "project.outputDirectory=$GITHUB_WORKSPACE" \
            --setvars "project.version=$XPILOT_VERSION" \
            --setvars "apple_signing_identity=$SIGNING_IDENTITY"

      - name: Notarize installer
        if: env.RELEASE_BUILD == 'true'
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit xPilot.dmg \
            --apple-id "$NOTARIZATION_USERNAME" --password "$NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple xPilot.dmg
          xcrun stapler validate xPilot.dmg
          mv xPilot.dmg "xPilot-$XPILOT_VERSION-MacOS.dmg"

      - name: Upload installer artifact
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xPilot-${{ env.XPILOT_VERSION }}-macOS.zip
          path: xPilot-${{ env.XPILOT_VERSION }}-MacOS.dmg
          if-no-files-found: error

      - name: Create artifacts archive
        run: |
          mkdir -p macos/plugin
          cp -R xPilot macos/plugin/
          cp BUILD-STATUS.txt macos/
          ditto "$CLIENT_DIR/build/xPilot.app" macos/xPilot.app
          ditto -c -k macos macOS.zip

      - name: Verify archived application bundle (static only)
        env:
          SIGNING_TEAM: ${{ env.RELEASE_BUILD == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          archive_check_dir=$(mktemp -d "$RUNNER_TEMP/xpilot-archive.XXXXXX")
          trap 'rm -rf "$archive_check_dir"' EXIT
          ditto -x -k macOS.zip "$archive_check_dir"
          options=(--signature development)
          if [[ "$RELEASE_BUILD" == true ]]; then
            options=(--signature developer-id --team-id "$SIGNING_TEAM")
          fi
          ./scripts/verify_macos_app.sh "$archive_check_dir/xPilot.app" "${options[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS.zip${{ steps.policy.outputs.artifact_suffix }}
          path: macOS.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always() && env.RELEASE_BUILD == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/xpilot-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/xpilot-signing.keychain-db"
          fi
