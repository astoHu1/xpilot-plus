name: "Build xPilot for macOS"

on:
  workflow_call:
  workflow_dispatch:

env:
  MIN_OS_VERSION: 11.0
  BUILD_TYPE: Release
  VATSIM_CLIENT_ID: ${{ secrets.VATSIM_CLIENT_ID }}
  VATSIM_CLIENT_KEY: ${{ secrets.VATSIM_CLIENT_KEY }}
  VATSIM_TOWERVIEW_CLIENT_ID: ${{ secrets.VATSIM_TOWERVIEW_CLIENT_ID }}
  CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY }}
  CLIENT_DIR: ${{ github.workspace }}/client
  PLUGIN_DIR: ${{ github.workspace }}/plugin
  IB_URL: https://releases.installbuilder.com/installbuilder/installbuilder-enterprise-24.3.0-osx-installer.dmg
  IB_LICENSE: ${{ secrets.INSTALLBUILDER_LICENSE }}
  APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
  APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
  APPLE_SIGNING_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_SIGNING_CERTIFICATE_IDENTITY }}
  NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
  NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  QT_VERSION: "6.5.2"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Load developer certificate
        if: ${{ env.APPLE_SIGNING_CERTIFICATE != '' }}
        env:
          CERTIFICATE: ${{ env.APPLE_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ env.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/make_keychain.sh

      ### Buid Plugin ###

      - name: Build plugin
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MIN_OS_VERSION }} && cmake --build . --config ${{ env.BUILD_TYPE }}

      - name: Extract debug symbols
        working-directory: ${{ env.PLUGIN_DIR }}/build/mac_x64
        run: |
          dsymutil xPilot.xpl -o xPilot.dSYM

      - name: Package plugin
        run: |
          mkdir -p ${{ github.workspace }}/xPilot/mac_x64
          cp ${{ env.PLUGIN_DIR }}/build/mac_x64/xPilot.xpl ${{ github.workspace }}/xPilot/mac_x64
          cp -R ${{ env.PLUGIN_DIR }}/build/mac_x64/xPilot.dSYM ${{ github.workspace }}/xPilot/mac_x64
          cp ${{ env.PLUGIN_DIR }}/3rdparty/fmod/libfmod.dylib ${{ github.workspace }}/xPilot/mac_x64
          cp -R ${{ env.PLUGIN_DIR }}/Resources ${{ github.workspace }}/xPilot/

      - name: Fix FMOD rpath
        working-directory: ${{ github.workspace }}/xPilot/mac_x64
        run: |
          install_name_tool -id @executable_path/../../../Resources/plugins/xPilot/mac_x64/libfmod.dylib libfmod.dylib
          install_name_tool -change @rpath/libfmod.dylib @executable_path/../../../Resources/plugins/xPilot/mac_x64/libfmod.dylib xPilot.xpl

      - name: Code sign plugin
        working-directory: ${{ github.workspace }}/xPilot/mac_x64
        shell: bash
        run: |
          if [[ -n "${APPLE_SIGNING_CERTIFICATE_IDENTITY}" ]]; then
            codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_CERTIFICATE_IDENTITY}" libfmod.dylib
            codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_CERTIFICATE_IDENTITY}" xPilot.xpl
          else
            codesign --force --sign - libfmod.dylib
            codesign --force --sign - xPilot.xpl
          fi
          codesign --verify --strict libfmod.dylib
          codesign --verify --strict xPilot.xpl

      ### Build Client ###

      - name: Download Qt
        run: |
          python3 -m venv /tmp/aqt-venv
          source /tmp/aqt-venv/bin/activate
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt mac desktop ${{ env.QT_VERSION }} clang_64 -m qtmultimedia --outputdir ${{ github.workspace }}/qt6

      - name: Setup Qt
        run: |
          echo "Qt6_DIR=$(pwd)/qt6/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV
          echo "QT_PLUGIN_PATH=$(pwd)/qt6/${{ env.QT_VERSION }}/macos/plugins" >> $GITHUB_ENV
          echo "QML2_IMPORT_PATH=$(pwd)/qt6/${{ env.QT_VERSION }}/macos/qml" >> $GITHUB_ENV
          echo "$(pwd)/qt6/${{ env.QT_VERSION }}/macos/bin" >> $GITHUB_PATH
          python3 - <<'PY'
          from pathlib import Path

          qt_lib = Path("qt6/${{ env.QT_VERSION }}/macos/lib")
          finder = qt_lib / "cmake/Qt6/FindWrapOpenGL.cmake"
          text = finder.read_text()
          block = '''        find_library(WrapOpenGL_AGL NAMES AGL)
                  if(WrapOpenGL_AGL)
                      set(__opengl_agl_fw_path "${WrapOpenGL_AGL}")
                  endif()
                  if(NOT __opengl_agl_fw_path)
                      set(__opengl_agl_fw_path "-framework AGL")
                  endif()

          '''
          text = text.replace(block, "")
          text = text.replace("        target_link_libraries(WrapOpenGL::WrapOpenGL INTERFACE ${__opengl_agl_fw_path})\n", "")
          finder.write_text(text)

          for path in qt_lib.glob("*.prl"):
              path.write_text(path.read_text().replace("-framework AGL", ""))
          PY
          chmod -R +x qt6

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DVATSIM_CLIENT_ID=${{ env.VATSIM_CLIENT_ID }} \
            -DVATSIM_CLIENT_KEY=${{ env.VATSIM_CLIENT_KEY }} \
            -DVATSIM_TOWERVIEW_CLIENT_ID=${{ env.VATSIM_TOWERVIEW_CLIENT_ID }} \
            -DCONFIG_ENCRYPTION_KEY=${{ env.CONFIG_ENCRYPTION_KEY }} \
            -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} \
            -DOPENSSL_ROOT_DIR=${{ github.workspace }}/dependencies/platform/macos/openssl \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MIN_OS_VERSION }}
          cmake --build . --config ${{ env.BUILD_TYPE }}

      - name: Deploy application
        shell: bash
        run: |
          ./scripts/package_macos.sh \
            "${CLIENT_DIR}/build/xPilot.app" \
            "${CLIENT_DIR}/Resources" \
            "${CLIENT_DIR}/entitlements.plist" \
            "${APPLE_SIGNING_CERTIFICATE_IDENTITY}"

      - name: Verify application bundle
        shell: bash
        run: ./scripts/verify_macos_app.sh "${CLIENT_DIR}/build/xPilot.app"

      - name: Notarize application bundle
        if: ${{ env.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' && env.NOTARIZATION_USERNAME != '' && env.NOTARIZATION_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        shell: bash
        run: |
          ditto -c -k --keepParent "${CLIENT_DIR}/build/xPilot.app" xPilot-notarization.zip
          xcrun notarytool submit xPilot-notarization.zip \
            --apple-id "${NOTARIZATION_USERNAME}" \
            --password "${NOTARIZATION_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${CLIENT_DIR}/build/xPilot.app"
          xcrun stapler validate "${CLIENT_DIR}/build/xPilot.app"

      - name: Get version
        shell: bash
        run: |
          echo "XPILOT_VERSION=$(cat xpilot.json | jq -r 'if .is_beta == true then "\(.version.major).\(.version.minor).\(.version.patch)-beta.\(.beta_number)" else "\(.version.major).\(.version.minor).\(.version.patch)" end')" >> $GITHUB_ENV

      - name: Setup InstallBuilder
        if: ${{ env.IB_LICENSE != '' && env.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' }}
        shell: bash
        run: |
          curl -k -L ${{ env.IB_URL }} --output ib.dmg
          hdiutil attach ib.dmg
          /Volumes/InstallBuilder\ Enterprise/*.app/Contents/MacOS/installbuilder.sh --mode unattended --prefix ../ib
          ../ib/bin/builder --version
          echo "$IB_LICENSE" > lic.xml
          echo "CLIENT_BUILD_DIR=${{ env.CLIENT_DIR }}/build" >> $GITHUB_ENV
          echo "PLUGIN_BUILD_DIR=${{ github.workspace }}/xPilot" >> $GITHUB_ENV

      - name: Create installer
        if: ${{ env.IB_LICENSE != '' && env.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' }}
        shell: bash
        run: |
          ../ib/bin/builder build installer/macos.xml \
              --license lic.xml \
              --setvars project.outputDirectory=$(pwd) \
              --setvars project.version=${{ env.XPILOT_VERSION }} \
              --setvars apple_signing_identity=${{ secrets.APPLE_SIGNING_CERTIFICATE_IDENTITY }} \
              --setvars password=${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}

      - name: Notarize installer
        if: ${{ env.IB_LICENSE != '' && env.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' && env.NOTARIZATION_USERNAME != '' && env.NOTARIZATION_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        shell: bash
        run: |
          xcrun notarytool submit xPilot.dmg \
            --apple-id "${NOTARIZATION_USERNAME}" \
            --password "${NOTARIZATION_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple xPilot.dmg
          xcrun stapler validate xPilot.dmg

      - name: Rename dmg
        if: ${{ env.IB_LICENSE != '' && env.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' }}
        run: |
          mv xPilot.dmg xPilot-${{ env.XPILOT_VERSION }}-MacOS.dmg

      - name: Upload installer artifact
        if: ${{ env.IB_LICENSE != '' && env.APPLE_SIGNING_CERTIFICATE_IDENTITY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: xPilot-${{ env.XPILOT_VERSION }}-MacOS.zip
          path: |
            xPilot-${{ env.XPILOT_VERSION }}-MacOS.dmg

      - name: Create artifacts archive
        run: |
          mkdir -p macos/plugin
          cp -R ${{ github.workspace }}/xPilot macos/plugin/
          cp -R ${{ env.CLIENT_DIR }}/build/xPilot.app macos/xPilot.app
          ditto -c -k --sequesterRsrc macos macOS.zip

      - name: Verify archived application bundle
        shell: bash
        run: |
          ARCHIVE_CHECK_DIR=$(mktemp -d "${TMPDIR:-/tmp}/xpilot-archive.XXXXXX")
          ditto -x -k macOS.zip "$ARCHIVE_CHECK_DIR"
          ./scripts/verify_macos_app.sh "$ARCHIVE_CHECK_DIR/xPilot.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS.zip
          path: ${{ github.workspace }}/macOS.zip
