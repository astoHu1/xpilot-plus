name: "Build xPilot"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  package-checks:
    uses: ./.github/workflows/package-checks.yml

  offline-tests:
    uses: ./.github/workflows/afv-tests.yml

  windows:
    needs: [offline-tests, package-checks]
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    needs: [offline-tests, package-checks]
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  linux:
    needs: [offline-tests, package-checks]
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  ########################## Create Release ##########################

  release:
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Get version
        id: get_version
        run: |
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Reorganize
        run: |
          for artifact in xPilot-*/; do
            mv "$artifact"/* .
            rmdir "$artifact"
          done

      - name: Merge artifacts
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          mkdir -p artifacts/Linux && mv Linux.zip/* artifacts/Linux
          mkdir -p artifacts/Windows && mv Windows.zip/* artifacts/Windows
          mkdir -p artifacts/macOS && mv macOS.zip/* artifacts/macOS
          cd artifacts && zip -r "../Artifacts-$RELEASE_VERSION.zip" .

      - name: Create release notes
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          cat > CHANGELOG.txt << EOF
          ## Download
          - [Windows](https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/xPilot-$RELEASE_VERSION-Windows.exe)
          - [macOS](https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/xPilot-$RELEASE_VERSION-MacOS.dmg)
          - [Linux](https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/xPilot-$RELEASE_VERSION-Linux.run)

          ---

          ### Added

          ### Changed

          ### Fixed
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: xPilot ${{ steps.get_version.outputs.version }}
          prerelease: true
          draft: true
          body_path: CHANGELOG.txt
          files: |
            xPilot*
            Artifacts*.zip
